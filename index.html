<script>
(function(){
  const CH = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&@!?<>/|=+*";
  document.addEventListener("mouseenter", function(ev){
    const t = ev.target;
    const el = t && t.closest ? t.closest("button, a") : null;
    if (!el || el.__bkScr) return;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = []; let n;
    while ((n = walker.nextNode())) { if (n.textContent.trim()) nodes.push([n, n.textContent]); }
    if (!nodes.length) return;
    el.__bkScr = true;
    const t0 = Date.now(), dur = 400;
    const iv = setInterval(function(){
      const p = Math.min(1, (Date.now() - t0) / dur);
      nodes.forEach(function(pair){
        const orig = pair[1], keep = Math.floor(orig.length * p);
        let out = "";
        for (let i = 0; i < orig.length; i++) {
          const c = orig[i];
          out += (i < keep || c === " " || c === "\u00a0") ? c : CH[(Math.random() * CH.length) | 0];
        }
        pair[0].textContent = out;
      });
      if (p >= 1) { clearInterval(iv); nodes.forEach(function(pair){ pair[0].textContent = pair[1]; }); el.__bkScr = false; }
    }, 38);
  }, true);
})();
</script>

              <span style="font-size: clamp(9px, 1.2vh, 10.5px); font-weight: 600; letter-spacing: .06em; color: #F5C518; white-space: nowrap;">$ERIC</span>
              <span style="flex: 1;"></span>
            </div>

            <img data-mq="bootimg" src="assets/eric-photo.png" alt="ERIC" style="object-position: 50% 30%; position: absolute; top: clamp(28px, 6vh, 58px); right: clamp(14px, 2vw, 30px); width: clamp(150px, 30vh, 250px); height: clamp(150px, 30vh, 250px); object-fit: cover; z-index: 3; opacity: 1; clip-path: polygon(14px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 7px 100%, 0 calc(100% - 7px), 0 14px); box-shadow: 0 0 0 1px rgba(245,197,24,.5), 0 0 44px rgba(245,197,24,.22); animation: bakaFade 700ms 200ms ease both;">
            <sc-for list="{{ lines }}" as="l" hint-placeholder-count="12">
              <div style="font-family: {{ l.family }}; font-size: {{ l.size }}; font-weight: {{ l.weight }}; line-height: {{ l.lh }}; letter-spacing: {{ l.ls }}; text-align: {{ l.align }}; padding: {{ l.pad }}; margin: {{ l.margin }}; clip-path: {{ l.clip }}; border: {{ l.border }}; background: {{ l.bg }}; color: {{ l.color }}; text-shadow: {{ l.glow }}; text-wrap: pretty; white-space: {{ l.wrap }};">{{ l.text }}<sc-if value="{{ l.link }}" hint-placeholder-val="{{ false }}"><a href="assets/whitepaper.pdf" target="_blank" onClick="{{ openWp }}" style="color: #F5C518; text-decoration: underline; text-underline-offset: 3px; margin-left: 8px; text-shadow: 0 0 14px rgba(245,197,24,.4);" style-hover="color: #FFD84D">(link)</a></sc-if><sc-if value="{{ l.tweet }}" hint-placeholder-val="{{ false }}"><a href="https://x.com/elonmusk/status/1134609650114949120" target="_blank" style="color: #7FE9F2; text-decoration: underline; text-underline-offset: 3px; text-shadow: 0 0 14px rgba(124,255,166,.38);" style-hover="color: #F5C518">elon's pet bee</a>.</sc-if><sc-if value="{{ l.caret }}" hint-placeholder-val="{{ false }}"><span style="display: inline-block; width: .56em; height: 1em; vertical-align: -.14em; background: #45E0E6; box-shadow: 0 0 10px rgba(124,255,166,.7); margin-left: .12em; animation: bakaCaret 1.05s steps(1) infinite;"></span></sc-if></div>
            </sc-for>

            <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
              <div data-mq="ready" style="margin-top: clamp(26px, 5.5vh, 64px); text-align: right; animation: bakaRise 420ms ease both;">
                <a href="Dashboard.dc.html" style="display: inline-block; font-family: 'VT323', monospace; font-size: clamp(17px, 2.4vh, 23px); letter-spacing: .08em; padding: clamp(8px, 1.6vh, 14px) clamp(20px, 2.2vw, 32px) clamp(7px, 1.4vh, 12px); background: #F5C518; color: #04101E; border: none; text-decoration: none; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); animation: bakaBtnGlow2 2.2s ease-in-out infinite; transition: background 140ms linear, color 140ms linear;" style-hover="background: #FFD84D">ENTER THE TERMINAL &gt;</a>
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>

    </div>

    <div style="position: relative; z-index: 0; flex: 0 0 auto; width: min(50%, 430px); height: 14px; margin-top: 14px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.9) 0%, rgba(0,0,0,0) 70%); filter: blur(4px);"></div>
    <div style="position: absolute; left: 50%; bottom: -2%; transform: translateX(-50%); width: min(72%, 620px); height: 34px; pointer-events: none; z-index: 0; border-radius: 50%; background: radial-gradient(ellipse, rgba(124,255,166,.08) 0%, rgba(124,255,166,0) 70%); filter: blur(10px);"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
const LINES = [
  { t: "> IBM built a quantum computer.", k: "body" },
  { t: "> anyone gets 10 free minutes a month.", k: "body" },
  { t: "> we spent ours on a bee.", k: "body" },
  { t: "", k: "gap" },
  { t: "> his name is eric. after ", k: "body", tweet: true },
  { t: "> the machine decides where he flies.", k: "body" },
  { t: "", k: "gap" },
  { t: "> yes, this is a meme.", k: "body" },
  { t: "> the machine doesn't know that.", k: "body" },
  { t: "> do not tell the machine.", k: "body" },
  { t: "", k: "gap" },
  { t: "EYE. BEE. M.", k: "eq" },
  { t: "", k: "gap" },
  { t: "> it was always about the bee.", k: "body" },
  { t: "", k: "gap" },
  { t: "$ERIC paired with $IBM", k: "body" }
];

const KEY = "baka_entry_seen_v1";
const BLOCKS = 16;
const USERS = [
  { img: "assets/doge.png", name: "doge" },
  { img: "assets/floki.png", name: "floki" },
  { img: "assets/babyfloki.png", name: "babyfloki" },
  { img: "assets/eric-logo-white.png", name: "eric" }
];

const S = (n) => { if (window.BakaAudio) window.BakaAudio.sfx(n); };

class Component extends DCLogic {
  state = { phase: "select", auth: 0, granted: false, done: 0, partial: "", ready: false, flash: false, cursorOn: false, cx: "76%", cy: "82%", cdur: "0ms", ctf: "linear", hover: false, clicking: false, clicked: false, hoverIdx: -1, selected: false };
  timers = [];

  componentDidMount() {
    let seen = false;
    try { seen = !!localStorage.getItem(KEY); } catch (e) {}
    try { localStorage.setItem(KEY, "1"); } catch (e) {}
    this.setState({ muted: window.BakaAudio ? window.BakaAudio.isMuted() : true });
    setTimeout(() => { if (window.BakaAudio) this.setState({ muted: window.BakaAudio.isMuted() }); }, 600);
    this.prefetchWp();
    this.sndIv = setInterval(() => this.forceUpdate(), 1200);
    this.onKey = () => this.skip();
    window.addEventListener("keydown", this.onKey);
    this.narrow = typeof window !== "undefined" && window.innerWidth < 760;
    this.onResize = () => {
      const n = window.innerWidth < 760;
      if (n !== this.narrow) { this.narrow = n; this.forceUpdate(); }
    };
    window.addEventListener("resize", this.onResize);

    const EASE = "cubic-bezier(.35,.7,.3,1)";
    const move = (x, y, dur, ms, tf) => this.at(() => { this.setState({ cx: x, cy: y, cdur: dur, ctf: tf || EASE }); S("glide"); }, ms);
    const colX = (i) => (50 + (i - 1.5) * 15).toFixed(2) + "%";
    const rowY = "50.5%";
    let clickAt;
    const N = USERS.length;
    const mob = typeof window !== "undefined" && window.innerWidth < 760;
    if (mob) {
      this.at(() => this.setState({ cursorOn: true, cx: "80%", cy: "86%", cdur: "0ms" }), 150);
      this.at(() => {
        const crt = document.querySelector('[data-mq="crt"]');
        if (!crt) return;
        const r0 = crt.getBoundingClientRect();
        const imgs = Array.from(crt.querySelectorAll("img")).slice(0, 4);
        if (imgs.length < 4 || !r0.width) return;
        const pos = imgs.map((im) => {
          const r = im.getBoundingClientRect();
          return [((r.left + r.width / 2 - r0.left) / r0.width * 100).toFixed(1) + "%", ((r.top + r.height / 2 - r0.top) / r0.height * 100).toFixed(1) + "%"];
        });
        const order = [0, 1, 2, 3];
        order.forEach((idx, i) => {
          const t = i * 380;
          this.at(() => { this.setState({ cx: pos[idx][0], cy: pos[idx][1], cdur: "340ms", ctf: "cubic-bezier(.35,.7,.3,1)" }); S("glide"); }, t);
          this.at(() => { this.setState({ hoverIdx: idx }); S("hover"); }, t + 220);
        });
      }, 620);
      clickAt = 620 + 4 * 380 + 280;
    } else if (seen) {
      this.at(() => this.setState({ cursorOn: true, cx: "80%", cy: "84%", cdur: "0ms" }), 150);
      move("58%", "62%", "500ms", 300);
      move(colX(0), rowY, "550ms", 950);
      move(colX(N - 2), rowY, "1680ms", 1650, "linear");
      for (let i = 0; i < N - 1; i++) this.at(() => { this.setState({ hoverIdx: i }); S("hover"); }, 1650 + i * 280);
      move(colX(N - 1), rowY, "600ms", 3330, "cubic-bezier(0,0,.2,1)");
      this.at(() => { this.setState({ hoverIdx: N - 1 }); S("hover"); }, 3930);
      clickAt = 4360;
    } else {
      this.at(() => this.setState({ cursorOn: true, cx: "80%", cy: "84%", cdur: "0ms" }), 600);
      move("32%", "28%", "1100ms", 900);
      move("62%", "60%", "950ms", 2450);
      move("46%", "36%", "800ms", 3900);
      move(colX(0), rowY, "900ms", 5100);
      move(colX(N - 2), rowY, "3360ms", 6250, "linear");
      for (let i = 0; i < N - 1; i++) this.at(() => { this.setState({ hoverIdx: i }); S("hover"); }, 6250 + i * 560);
      move(colX(N - 1), rowY, "1100ms", 9610, "cubic-bezier(0,0,.2,1)");
      this.at(() => { this.setState({ hoverIdx: N - 1 }); S("hover"); }, 10710);
      clickAt = 11350;
    }
    this.at(() => { this.setState({ clicking: true }); S("click"); }, clickAt);
    this.at(() => { this.setState({ clicking: false, clicked: true, selected: true }); S("coin"); }, clickAt + 220);
    this.at(() => { this.setState({ phase: "login" }); S("tab"); }, clickAt + (seen ? 500 : 1000));
    this.at(() => this.setState({ cursorOn: false }), clickAt + (seen ? 650 : 1200));

    const step = seen ? 60 : 300;
    const startAt = clickAt + (seen ? 800 : 1500);
    for (let i = 1; i <= BLOCKS; i++) this.at(() => { this.setState({ auth: i }); S("blip"); }, startAt + i * step);
    const grantAt = startAt + BLOCKS * step + 350;
    this.at(() => { this.setState({ granted: true }); S("connect"); }, grantAt);
    this.at(() => { this.setState({ phase: "boot", ready: true }); S("boot"); }, grantAt + (seen ? 400 : 1200));
    if (seen) this.fastBoot(grantAt + 500); else this.run(0, grantAt + 1600);
  }

  componentWillUnmount() {
    clearInterval(this.sndIv);
    this.timers.forEach(clearTimeout);
    window.removeEventListener("keydown", this.onKey);
    window.removeEventListener("resize", this.onResize);
  }

  at(fn, ms) { this.timers.push(setTimeout(fn, ms)); }
  prefetchWp() {
    if (this._wpStarted) return;
    this._wpStarted = true;
    fetch("assets/whitepaper.pdf").then(r => r.blob()).then(b => {
      this.setState({ wpUrl: URL.createObjectURL(b.slice(0, b.size, "application/pdf")) });
    }).catch(() => {});
  }
  openWp(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    this.prefetchWp();
    this.sndIv = setInterval(() => this.forceUpdate(), 1200);
    this.loadWpDoc();
    this.setState({ wpOpen: true });
  }
  loadWpDoc() {
    if (this.wpDoc || this._wpDocLoading) return;
    this._wpDocLoading = true;
    const boot = () => {
      const lib = window.pdfjsLib;
      if (!lib) { this._wpDocLoading = false; return; }
      lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      fetch("assets/whitepaper.pdf").then(r => r.arrayBuffer()).then(buf => lib.getDocument({ data: buf }).promise).then(doc => {
        this.wpDoc = doc;
        this.setState({ wpPages: doc.numPages, wpPage: 1 });
        setTimeout(() => this.renderWpPage(1), 50);
      }).catch(() => { this._wpDocLoading = false; });
    };
    if (window.pdfjsLib) boot();
    else {
      const sc2 = document.createElement("script");
      sc2.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      sc2.onload = boot;
      sc2.onerror = () => { this._wpDocLoading = false; };
      document.head.appendChild(sc2);
    }
  }
  wpResizeHook() {
    if (this._wpResized) return;
    this._wpResized = true;
    window.addEventListener("resize", () => {
      if (this.state.wpOpen) this.renderWpPage(this.state.wpPage || 1);
    });
  }
  renderWpPage(n) {
    this.wpResizeHook();
    const doc = this.wpDoc, cv = this.wpCanvas;
    if (!doc || !cv) return;
    doc.getPage(n).then(pg => {
      let area = cv.parentElement;
      while (area && !(area.style && (area.style.overflow === "auto" || area.style.overflowY === "auto"))) area = area.parentElement;
      const availW = area ? area.clientWidth : (window.innerWidth || 800);
      const z = this.state.wpZoom || 1;
      const maxW = Math.max(200, Math.min(860, availW - 64)) * z;
      const v1 = pg.getViewport({ scale: 1 });
      const scale = Math.max(0.2, maxW / v1.width);
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const vp = pg.getViewport({ scale: scale * dpr });
      if (this._wpTask && this._wpTask.cancel) { try { this._wpTask.cancel(); } catch (e) {} }
      cv.width = vp.width; cv.height = vp.height;
      cv.style.width = (vp.width / dpr) + "px";
      cv.style.height = (vp.height / dpr) + "px";
      const c2 = cv.getContext("2d");
      c2.setTransform(1, 0, 0, 1, 0, 0);
      c2.clearRect(0, 0, cv.width, cv.height);
      this._wpTask = pg.render({ canvasContext: c2, viewport: vp });
    }).catch(() => {});
  }

  fastBoot(start) {
    LINES.forEach((_, i) => this.at(() => { this.setState({ done: i + 1, partial: "" }); S("type"); }, start + 220 * i));
    this.at(() => { this.setState({ ready: true }); S("plant"); }, start + 220 * LINES.length + 600);
  }

  run(i, delay) {
    if (i >= LINES.length) { this.at(() => { this.setState({ ready: true }); S("plant"); }, delay + 420); return; }
    const line = LINES[i];
    if (line.k === "gap") {
      this.at(() => this.setState({ done: i + 1, partial: "" }), delay);
      this.run(i + 1, delay + 520);
      return;
    }
    const eq = line.k === "eq";
    const speed = eq ? 50 : 26;
    let t = delay + (eq ? 800 : 420);
    for (let c = 1; c <= line.t.length; c++) {
      const slice = line.t.slice(0, c);
      this.at(() => { this.setState({ partial: slice }); if (c % 2 === 1) S("type"); }, t);
      t += speed;
    }
    this.at(() => this.setState({ done: i + 1, partial: "" }), t);
    if (eq) {
      this.at(() => { this.setState({ flash: true }); S("coin"); }, t + 400);
      this.at(() => this.setState({ flash: false }), t + 800);
      t += 1200;
    }
    this.run(i + 1, t);
  }

  skip() {
    if (this.state.ready) return;
    this.timers.forEach(clearTimeout);
    this.timers = [];
    this.setState({ phase: "boot", auth: BLOCKS, granted: true, done: LINES.length, partial: "", ready: true, flash: false, cursorOn: false, hover: false, clicking: false, clicked: true, hoverIdx: -1, selected: true });
  }

  renderVals() {
    const s = this.state;
    const style = (k) => k === "head"
      ? { family: "'IBM Plex Mono', monospace", size: "clamp(11px, 1.6vh, 14px)", weight: "600", lh: "1.9", ls: ".16em", align: "left", pad: "0", margin: "0", border: "none", bg: "transparent", color: "#F5C518", glow: "0 0 14px rgba(245,197,24,.4)", wrap: "normal", clip: "none" }
      : k === "eq"
        ? { family: "'VT323', monospace", size: "clamp(13px, 1.55vw, 21px)", weight: "400", lh: "1.25", ls: ".03em", align: "center", pad: "clamp(6px, 1.6vh, 18px) clamp(10px, 1.6vw, 24px)", margin: "clamp(4px, 1vh, 12px) 0", border: s.flash ? "1px solid #F5C518" : "1px solid rgba(245,197,24,.4)", bg: s.flash ? "#F5C518" : "rgba(245,197,24,.05)", color: s.flash ? "#04101E" : "#F5C518", glow: s.flash ? "none" : "0 0 26px rgba(245,197,24,.55)", wrap: this.narrow ? "normal" : "nowrap", clip: "polygon(14px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 7px 100%, 0 calc(100% - 7px), 0 14px)" }
        : { family: "'IBM Plex Mono', monospace", size: "clamp(11px, 1.75vh, 14px)", weight: "400", lh: "clamp(16px, 3vh, 28px)", ls: "0", align: "left", pad: "0 clamp(150px, 26vh, 235px) 0 0", margin: "0", border: "none", bg: "transparent", color: "#7FE9F2", glow: "0 0 14px rgba(124,255,166,.38)", wrap: "nowrap", clip: "none" };

    const lines = [];
    for (let i = 0; i < LINES.length; i++) {
      const l = LINES[i];
      if (i < s.done) lines.push({ text: l.k === "gap" ? "\u00a0" : l.t, caret: false, link: !!l.link, tweet: !!l.tweet, ...style(l.k === "gap" ? "body" : l.k), ...(l.k === "gap" ? { lh: "clamp(14px, 2.6vh, 26px)" } : {}) });
      else if (i === s.done && s.done < LINES.length) { lines.push({ text: s.partial, caret: true, link: false, tweet: false, ...style(l.k === "gap" ? "body" : l.k) }); break; }
      else break;
    }

    const authBlocks = Array.from({ length: BLOCKS }, (_, i) => ({ bg: i < s.auth ? "#F5C518" : "#0A1526" }));

    return {
      lines, authBlocks,
      login: s.phase === "login",
      booting: s.phase === "boot",
      ready: s.ready,
      authLabel: s.granted ? "access granted" : (s.clicked ? "logging in..." : "\u00a0"),
      cursorOn: s.cursorOn && s.phase !== "boot",
      select: s.phase === "select",
      ...Object.fromEntries(USERS.map((u, i) => {
        const hot = i === s.hoverIdx && !s.selected;
        const isBaka = i === USERS.length - 1;
        const win = s.selected && isBaka;
        return ["u" + i, {
          op: s.selected ? (isBaka ? 1 : 0.18) : 1,
          tf: win ? "scale(1.16) translateY(-4px)" : hot ? "scale(1.05)" : "scale(1)",
          ring: win ? "0 0 0 2px #F5C518, 0 0 34px rgba(245,197,24,.6)" : hot ? "0 0 0 1px rgba(124,255,166,.6), 0 0 18px rgba(124,255,166,.25)" : "0 0 0 1px rgba(124,255,166,.22)",
          fx: win ? "brightness(1.05)" : hot ? "grayscale(.15) brightness(.95)" : "grayscale(.55) brightness(.72)",
          nameColor: win ? "#F5C518" : hot ? "#7FE9F2" : "#5E8CA4"
        }];
      })),
      cx: s.cx, cy: s.cy, cdur: s.cdur, ctf: s.ctf,
      clickRing: s.clicking,
      cursorScale: s.clicking ? "scale(.78)" : "scale(1)",
      avatarFx: s.hover ? "brightness(1.18)" : "brightness(1)",
      avatarTf: s.hover ? "scale(1.05)" : "scale(1)",
      sessionLabel: s.ready ? "ACTIVE" : "OPENING",
      statusLabel: s.ready ? "READY" : (s.phase === "login" ? "LOGIN" : "BOOTING"),
      hintLabel: s.ready ? "\u00a0" : "TAP ANYWHERE TO SKIP",
      showSkip: !s.ready,
      goHome: (e) => { e.stopPropagation(); window.location.href = "Dashboard.dc.html"; },
      soundLabel: (() => { const A = window.BakaAudio; return (A && !A.isMuted() && A.isLive()) ? "sound: on" : "sound: off"; })(),
      toggleMute: (e) => {
        e.stopPropagation();
        const A = window.BakaAudio; if (!A) return;
        const on = !A.isMuted() && A.isLive();
        if (on) { if (!A.isMuted()) A.toggleMute(); }
        else { if (A.isMuted()) A.toggleMute(); else A.tryArm(); }
        this.setState({ muted: A.isMuted() });
      },
      skip: () => this.skip(),
      stopClick: (e) => e.stopPropagation(),
      wpOpen: !!s.wpOpen,
      wpClose: (e) => { if (e) e.stopPropagation(); this.setState({ wpOpen: false }); },
      wpStop: (e) => e.stopPropagation(),
      wpHref: s.wpUrl || "",
      wpReady: !!s.wpPages,
      wpNotReady: !s.wpPages,
      wpCanvasRef: (el) => { this.wpCanvas = el; if (el) this.renderWpPage(this.state.wpPage || 1); },
      wpPageLabel: (s.wpPage || 1) + " / " + (s.wpPages || 1),
      wpZoomIn: () => { const z = Math.min(2.4, (this.state.wpZoom || 1) * 1.25); this.setState({ wpZoom: z }); this.renderWpPage(this.state.wpPage || 1); },
      wpZoomOut: () => { const z = Math.max(0.5, (this.state.wpZoom || 1) / 1.25); this.setState({ wpZoom: z }); this.renderWpPage(this.state.wpPage || 1); },
      wpPrev: () => { const n = Math.max(1, (this.state.wpPage || 1) - 1); this.setState({ wpPage: n }); this.renderWpPage(n); },
      wpNext: () => { const n = Math.min(this.state.wpPages || 1, (this.state.wpPage || 1) + 1); this.setState({ wpPage: n }); this.renderWpPage(n); },
      openWp: (e) => this.openWp(e),
      mobW: !!s.mobW,
      enterGo: (e) => {
        try {
          if (window.innerWidth < 760 && !localStorage.getItem("baka_mob_v1")) {
            e.preventDefault();
            e.stopPropagation();
            this.setState({ mobW: true });
          }
        } catch (err) {}
      },
      mobGo: (e) => {
        e.stopPropagation();
        try { localStorage.setItem("baka_mob_v1", "1"); } catch (err) {}
        window.location.href = "Dashboard.dc.html";
      }
    };
  }
}
</script>
